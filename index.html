<title>Dhaka Metro Smart Transit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plan journeys, check fares, explore stations and read the published schedule for Dhaka MRT Line 6. Independent informational guide.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: printed station-board language. Green header bands, notched tag headings, a vertical line diagram with fare tags as the signature element. Palette sampled from the DMTCL fare chart. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F6F4; --fg:#231F20; --muted:#58595B; --line:#C5D2D0;
  --brand:#006B56; --brand-dk:#004B3C; --accent:#D9E9E6; --on-brand:#FFFFFF; --brand-ink:#006B56;
  --red:#D13014; --hero-bg:#006B56; --hero-fg:#FFFFFF; --hero-2:#0A7C66; --hero-3:#BFE3D8;
  --warn-bg:#FFF1CC; --warn-fg:#6B4700; --crit-bg:#FBE4DF; --crit-fg:#9A200B; --ok-bg:#D9E9E6; --ok-fg:#004B3C;
  --font:'Source Sans 3','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1815; --surface:#14211D; --surface2:#1A2A25; --fg:#E9F1EE; --muted:#A3B6AF; --line:#2B413A;
  --brand:#2AA283; --brand-dk:#0B2D26; --accent:#1F3A33; --on-brand:#03201A; --brand-ink:#5CC9AB;
  --red:#F0654C; --hero-bg:#0B2D26; --hero-fg:#F2F8F5; --hero-2:#12403A; --hero-3:#9ED3C4;
  --warn-bg:#3A2E0C; --warn-fg:#F3CF74; --crit-bg:#3F1A17; --crit-fg:#F6A39B; --ok-bg:#1F3A33; --ok-fg:#A8E3CF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#14211D; --surface2:#1A2A25; --fg:#E9F1EE; --muted:#A3B6AF; --line:#2B413A;
  --brand:#2AA283; --brand-dk:#0B2D26; --accent:#1F3A33; --on-brand:#03201A; --brand-ink:#5CC9AB;
  --red:#F0654C; --hero-bg:#0B2D26; --hero-fg:#F2F8F5; --hero-2:#12403A; --hero-3:#9ED3C4;
  --warn-bg:#3A2E0C; --warn-fg:#F3CF74; --crit-bg:#3F1A17; --crit-fg:#F6A39B; --ok-bg:#1F3A33; --ok-fg:#A8E3CF; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:700}
h2{font-size:clamp(1.3rem,2.6vw,1.7rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:3px}
.wrap{width:100%;max-width:1160px;margin-inline:auto}
.muted{color:var(--muted)}
.sm{font-size:.93rem}
.xs{font-size:.82rem}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:3px;z-index:100;border:0;cursor:pointer}
.skip:focus{left:8px}
svg.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
#hdr::after{content:"";position:absolute;left:0;bottom:-1px;width:min(120px,30vw);height:3px;background:var(--red)}
.hbar{display:flex;align-items:center;gap:10px;min-height:62px;max-width:1320px;margin-inline:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.08rem;color:var(--fg);text-decoration:none;white-space:nowrap;line-height:1.1}
.logo .mk{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.logo small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px}
.dnav{display:none;gap:0;margin-left:10px;flex:1}
.dnav a,.mnav a{color:var(--fg);text-decoration:none;font-weight:600;font-size:.95rem;padding:20px 9px 17px;border-bottom:3px solid transparent;white-space:nowrap}
.dnav a:hover,.mnav a:hover{background:var(--surface2)}
.dnav a[aria-current="page"],.mnav a[aria-current="page"]{border-bottom-color:var(--brand);color:var(--brand-ink)}
.hact{display:flex;align-items:center;gap:6px;margin-left:auto}
.ibtn{width:40px;height:40px;border-radius:4px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--surface2)}
.lang{height:40px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.lang:hover{background:var(--surface2)}
.mnav{display:none;flex-direction:column;padding:0 0 14px;max-width:1320px;margin-inline:auto}
.mnav.open{display:flex}
.mnav a{padding:13px 4px;border-bottom:1px solid var(--line);font-size:1.02rem}
.btn.hcta{display:none}
@media (min-width:1280px){.dnav{display:flex}.btn.hcta{display:inline-flex}#burger{display:none}.mnav,.mnav.open{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);border:2px solid var(--brand);border-radius:4px;
  padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost:hover{background:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}

/* page bands and headings */
main{display:block;outline:none}
main.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.band{background:var(--hero-bg);color:var(--hero-fg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--red)}
.band-in{max-width:1160px;margin-inline:auto;padding-block:clamp(22px,4vw,40px);display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.band h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
.band .alt{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:500;opacity:.92;margin-top:2px}
.band .lede{max-width:62ch;margin-top:12px;opacity:.92}
.band .eyebrow{color:var(--hero-3)}
.band a{color:#fff}
.tagh{display:inline-block;background:var(--brand);color:var(--on-brand);padding:6px 42px 6px 14px;font-weight:700;font-size:1.05rem;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 100%,0 100%);margin:0;line-height:1.25;max-width:100%}
.tagh small{font-weight:500;opacity:.9;font-size:.82em;margin-left:4px}
.sec{padding-block:clamp(28px,5vw,56px)}
.sec.tight{padding-block:clamp(18px,3vw,30px)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sh p{max-width:62ch;margin-top:10px;color:var(--muted)}
.lede{max-width:66ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.card h3{margin-bottom:8px}
.panel{background:var(--accent);border-radius:12px;padding:18px 20px;min-width:0}
.panel>.tagh{margin:-4px 0 12px -20px}
.panel ul{margin:0;padding-left:20px;display:grid;gap:6px}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--red)}
.hero-in{display:grid;gap:28px;padding-block:clamp(26px,5vw,52px);align-items:start;max-width:1160px;margin-inline:auto}
@media (min-width:960px){.hero-in{grid-template-columns:1.15fr .85fr}}
.hero p.lead{font-size:1.2rem;margin-top:10px;opacity:.95;max-width:44ch}
.hero .eyebrow{color:var(--hero-3)}
.hero .bnh{font-size:clamp(1.2rem,2.4vw,1.55rem);font-weight:500;margin-top:6px;opacity:.95}
.hero-art{min-width:0}
.planner{background:var(--surface);color:var(--fg);border-radius:6px;padding:16px;margin-top:22px}
.pl-row{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.pl-row{grid-template-columns:1fr auto 1fr auto;align-items:end}}
.fld label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}
select,input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;min-height:46px}
textarea{min-height:110px;resize:vertical}
select:focus,input:focus,textarea:focus{border-color:var(--brand)}
.swap{width:46px;height:46px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;display:grid;place-items:center;justify-self:center}
.swap:hover{background:var(--accent)}
.err{color:var(--crit-fg);font-size:.9rem;margin-top:8px}
.err:empty{display:none}

/* line diagram (signature element) */
.ldwrap{background:var(--surface);color:var(--fg);border-radius:6px;padding:0 0 10px;overflow:hidden}
.ldhead{background:var(--accent);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ldhead b{font-size:1rem}
.ld{list-style:none;margin:8px 0 0;padding:0 14px}
.ld li{position:relative;display:flex;align-items:center;gap:10px;min-height:34px;padding-left:34px}
.ld li::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:4px;background:var(--brand)}
.ld li:first-child::before{top:50%}
.ld li.last::before{bottom:50%}
.ld li.k::before{background:repeating-linear-gradient(to bottom,var(--muted) 0 4px,transparent 4px 8px)}
.ld .dot{position:absolute;left:5px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:3.5px solid var(--brand)}
.ld li.here .dot{background:var(--fg);border-color:var(--fg);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--red)}
.ld li.k .dot{border-color:var(--muted);border-style:dashed}
.ld button.nmx{flex:1;min-width:0;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;line-height:1.15}
.ld button.nmx:hover b{text-decoration:underline}
.ld .nmx b{display:block;font-weight:600;overflow-wrap:anywhere}
.ld .nmx small{color:var(--muted);font-size:.8rem}
.ld li.sel .nmx b{color:var(--brand-ink)}
.ftag{flex:none;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.82rem;padding:1px 9px;border-radius:11px;white-space:nowrap}
.ftag i{font-style:normal;opacity:.6;padding:0 3px}
.you{flex:none;color:var(--red);font-weight:700;font-size:.85rem;text-align:right;line-height:1.1}
.you small{display:block;font-weight:500;color:var(--muted)}
.kn{flex:none;font-size:.78rem;color:var(--muted)}

/* quick links */
.ql{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.ql a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 18px;text-decoration:none;color:var(--fg);border-left:5px solid var(--brand);border-bottom:1px solid var(--line);min-width:0}
.ql a:hover{background:var(--accent)}
.ql b{display:block;font-size:1.15rem}
.ql small{color:var(--muted);font-size:.9rem}
.ql .ic{color:var(--brand-ink);width:1.3em;height:1.3em}

/* lists and rows */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 13px;font-weight:600;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:1px 8px;font-size:.78rem;font-weight:700;background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.crit{background:var(--crit-bg);color:var(--crit-fg)}
.pill.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:700;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.unav{color:var(--muted);font-style:italic}
.rt{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.rt a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:13px 16px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line);align-items:center}
.rt a:last-child{border-bottom:0}
.rt a:hover{background:var(--accent)}
.rt .a{font-weight:600;overflow-wrap:anywhere}
.rt .a .arr{color:var(--brand-ink);padding:0 6px}
.rt .m{grid-column:1;color:var(--muted);font-size:.88rem}
.rt .f{grid-row:1/3;grid-column:2;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.strip{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px;text-decoration:none;color:var(--fg);min-width:0}
.sbtn:hover{background:var(--accent)}
.sno{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.sbtn span.t{min-width:0}.sbtn b{display:block;font-size:1rem;overflow-wrap:anywhere;line-height:1.15}.sbtn small{color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--on-brand);background:var(--brand);font-weight:700}
tbody tr:nth-child(even) td{background:var(--surface2)}
tr:last-child td{border-bottom:0}
.mx td,.mx th{text-align:center;padding:5px 6px;font-size:.84rem;min-width:36px;border:1px solid var(--line)}
.mx th{text-transform:none;letter-spacing:0}
.mx td.k{background:var(--red)!important;color:#fff;font-weight:700}
.mx td.z{background:var(--line)!important}
.mx td.x{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--accent) 4px 8px)!important;font-weight:700}
.mx th.rl{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--brand)}
.mx tr.kr td,.mx tr.kr th{opacity:.7}

/* timeline */
ol.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:14px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:13px;top:18px;bottom:-6px;width:4px;background:var(--brand)}
.tl li:last-child::before{display:none}
.tl .dot{width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--brand);position:relative;z-index:1;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.tl li.end .dot{background:var(--brand);color:var(--on-brand)}
.tl li.mid .dot{width:20px;height:20px;margin:5px;border-width:3px}
.tl li.mid::before{top:12px}
.tl .nm{font-weight:700;overflow-wrap:anywhere}
.tl .nm a{color:var(--fg);text-decoration:none}.tl .nm a:hover{text-decoration:underline}
.tl li.end .nm{font-size:1.08rem}

/* stats */
.stats{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{padding:12px 16px;border-right:1px solid var(--line);background:var(--surface)}
.stat .v{font-size:1.8rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted);margin-top:3px}
.stat.hl{background:var(--brand);color:var(--on-brand)}
.stat.hl .l{color:var(--on-brand);opacity:.9}
.skel{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1s infinite;border-radius:6px;height:90px;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.two{display:grid;gap:20px;align-items:start}
@media (min-width:900px){.two{grid-template-columns:340px 1fr}.two.rev{grid-template-columns:1fr 380px}.sticky{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}}

/* alerts */
.alert{display:grid;grid-template-columns:96px 1fr;gap:6px 18px;border-top:1px solid var(--line);padding:14px 0 14px 12px;border-left:5px solid var(--brand);background:var(--surface)}
.alert.warn{border-left-color:#C98A00}
.alert.crit{border-left-color:var(--red)}
.alert .dt{font-size:.85rem;color:var(--muted);font-weight:600}
.alert h3{font-size:1.05rem;margin:0 0 4px}
.alert .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.alist{display:grid;gap:0;border:1px solid var(--line);border-top:0;border-radius:6px;overflow:hidden}
@media (max-width:560px){.alert{grid-template-columns:1fr}}
.empty{border:1.5px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

details.fq{border-bottom:1px solid var(--line)}
details.fq:first-child{border-top:1px solid var(--line)}
details.fq summary{cursor:pointer;font-weight:600;padding:14px 4px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.fq summary::-webkit-details-marker{display:none}
details.fq[open] summary .ic{transform:rotate(180deg)}
details.fq[open] summary{color:var(--brand-ink)}
details.fq .a{padding:0 4px 16px;color:var(--muted);max-width:70ch}
ul.bl{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
ol.nl{margin:8px 0 0;padding-left:22px;display:grid;gap:8px}
.steps{display:grid;gap:0;counter-reset:s;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step{counter-increment:s;padding:16px 18px;border-right:1px solid var(--line);background:var(--surface)}
.step::before{content:counter(s);display:block;font-size:2.2rem;font-weight:700;line-height:1;color:var(--brand);margin-bottom:8px}
.step h3{font-size:1.05rem}

/* forms */
.ff{display:grid;gap:14px}
.ff .row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.ff label{font-weight:600;font-size:.95rem;display:block;margin-bottom:5px}
.ff .hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.ff .fe{color:var(--crit-fg);font-size:.88rem;margin-top:4px}
.ff .fe:empty{display:none}
[aria-invalid="true"]{border-color:var(--red)!important}
.rate{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- fare + route logic ---------- */
function fareInfo(a,b){
  if(a===b)return null;
  if(a>b){const t=a;a=b;b=t;}
  const e=FV[a+'-'+b];
  if(e&&e.hi)return {exact:false,f:null,src:'conflict',lo:e.f,hi:e.hi};
  if(e)return {exact:true,f:e.f,src:e.s,lo:e.f,hi:e.f};
  let lo=20,hi=100;
  for(const key in FV){
    const p=key.split('-').map(Number),f=FV[key].f;
    if(p[0]>=a&&p[1]<=b)lo=Math.max(lo,f);
    if(p[0]<=a&&p[1]>=b)hi=Math.min(hi,f);
  }
  return {exact:lo===hi,f:lo===hi?lo:null,src:lo===hi?'derived':'range',lo:lo,hi:hi};
}
function fareTxt(fi,pass){
  const g=pass?passFare:(x=>x);
  return fi.exact?tk(g(fi.f)):tk(g(fi.lo))+'–'+tk(g(fi.hi));
}

function bindPlanner(id,onGo){
  const a=$('#'+id+'a'),b=$('#'+id+'b'),e=$('#'+id+'e');
  $('#'+id+'s').onclick=()=>{const t=a.value;a.value=b.value;b.value=t;e.textContent='';};
  const chk=()=>{e.textContent=a.value===b.value?T('Choose two different stations.','দুটি ভিন্ন স্টেশন বাছাই করুন।'):'';};
  a.onchange=chk;b.onchange=chk;
  $('#'+id).onsubmit=ev=>{ev.preventDefault();chk();if(a.value===b.value){b.focus();return;}PL.a=+a.value;PL.b=+b.value;onGo();};
}
function routeCard(a,b){

function bCarousel(){
  const tr=$('#ctrack'); if(!tr)return;
  const slides=$$('.slide',tr), dots=$$('#cdots button'), pv=$('#cprev'), nx=$('#cnext'), pl=$('#cplay'), car=$('#car');
  const wide=()=>matchMedia('(min-width:900px)').matches;
  const step=()=>slides[0].offsetWidth+14;
  const idx=()=>Math.min(slides.length-1,Math.max(0,Math.round(tr.scrollLeft/step())));
  const go=i=>{if(wide())return;tr.scrollTo({left:i*step(),behavior:'smooth'});};
  const mark=()=>{const i=idx();dots.forEach((d,j)=>d.setAttribute('aria-current',String(j===i)));pv.disabled=i===0;nx.disabled=i>=slides.length-1;};
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches, hover=false, focus=false;
  const setPlay=p=>{paused=p;pl.innerHTML=ic(p?'play':'pause');pl.setAttribute('aria-label',p?T('Play','চালু করুন'):T('Pause','থামান'));pl.setAttribute('aria-pressed',String(p));};
  const stopAuto=()=>setPlay(true);
  const tick=()=>{if(wide()||paused||hover||focus||document.hidden)return;const i=idx();go(i>=slides.length-1?0:i+1);};
  setInterval(tick,6000);
  pl.onclick=()=>setPlay(!paused);
  pv.onclick=()=>{stopAuto();go(Math.max(0,idx()-1));};
  nx.onclick=()=>{stopAuto();go(Math.min(slides.length-1,idx()+1));};
  dots.forEach((d,j)=>d.onclick=()=>{stopAuto();go(j);});
  tr.addEventListener('scroll',mark,{passive:true});
  car.addEventListener('pointerenter',()=>hover=true);
  car.addEventListener('pointerleave',()=>hover=false);
  car.addEventListener('focusin',()=>focus=true);
  car.addEventListener('focusout',()=>focus=false);
  tr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();stopAuto();go(Math.min(slides.length-1,idx()+1));}if(e.key==='ArrowLeft'){e.preventDefault();stopAuto();go(Math.max(0,idx()-1));}});
  setPlay(paused);
  mark();
}

     '<circle class="ring" cx="'+x+'" cy="'+y+'" r="34"/><circle cx="'+x+'" cy="'+y+'" r="36" fill="transparent"/>'+
     ((s.n===1||s.n===16)?'<circle cx="'+x+'" cy="'+y+'" r="25" fill="none" style="stroke:var(--brand)" stroke-width="3" stroke-dasharray="3 5"/>':'')+
     '<circle class="mk" cx="'+x+'" cy="'+y+'" r="16"/>'+
     (s.plan?'<g transform="translate('+(x+16)+','+(y-16)+')"><circle r="12" style="fill:var(--red);stroke:var(--surface);stroke-width:3"/><path d="M-5 -2h10l-3 -3M5 2h-10l3 3" fill="none" style="stroke:#fff" stroke-width="2.4" stroke-linecap="round"/></g>':'')+
     '<text class="lb" x="'+lx+'" y="'+(y-2)+'" text-anchor="'+an+'" style="font-size:30px">'+N(s.n)+'. '+esc(nm(s))+'</text>'+
     '<text class="lb2" x="'+lx+'" y="'+(y+26)+'" text-anchor="'+an+'" style="font-size:24px">'+esc(nm2(s))+'</text></g>';
  });

function bMap(){
  const box=$('#mapbox'),panel=$('#mappanel'),q=$('#msq');
  $('#backb').onclick=()=>{if(history.length>1)history.back();else location.hash='#home';};
  const hint=()=>'<div class="card"><h3>'+T('Select a station','একটি স্টেশন বাছাই করুন')+'</h3><p class="sm muted">'+T('Click or press Enter on a station to see nearby spots and plan a journey from or to it.','স্টেশনে ক্লিক বা Enter চাপলে কাছের জায়গা দেখা যাবে এবং সেখান থেকে বা সেখানে যাত্রা পরিকল্পনা করা যাবে।')+'</p></div>';
  const draw=()=>{const st=box.scrollTop;box.innerHTML=mapSvg(q.value);box.scrollTop=st;$('#zlv').textContent=N(Math.round(MAPZ*100))+'%';
    $$('.stn',box).forEach(el=>{const pick=()=>sel(+el.dataset.n);el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};});};
  const sel=n=>{MAPSEL=n;draw();panel.innerHTML=stnPanel(n);
    $('#popx').onclick=()=>{MAPSEL=null;panel.innerHTML=hint();draw();};
    $('#pfrom').onclick=()=>{PL.a=n;if(PL.b===n)PL.b=n===16?1:16;go('planner');};
    $('#pto').onclick=()=>{PL.b=n;if(PL.a===n)PL.a=n===1?16:1;go('planner');};};
  const z=d=>{MAPZ=Math.min(2,Math.max(.7,Math.round((MAPZ+d)*10)/10));draw();};
  $('#zin').onclick=()=>z(.2);$('#zout').onclick=()=>z(-.2);$('#zrs').onclick=()=>{MAPZ=1;draw();};
  q.oninput=draw;
  q.onkeydown=e=>{if(e.key==='Enter'){const v=q.value.trim().toLowerCase();const m=ST.find(s=>s.en.toLowerCase().includes(v)||s.bn.includes(v)||String(s.n)===v);if(m){sel(m.n);const el=$('.stn.sel',box);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});}}};
  draw();panel.innerHTML=MAPSEL?stnPanel(MAPSEL):hint();
  if(MAPSEL)sel(MAPSEL);
}

function stList(){
  const q=SQ.trim().toLowerCase();
  let a=ST.filter(s=>(!q||s.en.toLowerCase().includes(q)||s.bn.includes(q)||s.area[0].toLowerCase().includes(q)||s.area[1].includes(q)||String(s.n)===q||s.code.toLowerCase()===q)&&
    (SF==='all'||(SF==='p1'&&s.ph===1)||(SF==='p2'&&s.ph===2)||(SF==='nb'&&s.nb.length)));
  if(SS==='az')a=a.slice().sort((x,y)=>x.en.localeCompare(y.en));

  return a.map(s=>'<a class="card scard" href="#station-'+s.slug+'"><div class="top"><span class="sno num">'+N(s.n)+'</span><div style="min-width:0"><h3>'+esc(nm(s))+'</h3><div class="xs muted">'+esc(nm2(s))+'</div></div></div>'+

}

function matrix(){
  let h='<thead><tr><th class="rl">'+T('From \\ To','থেকে \\ পর্যন্ত')+'</th>'+ST.map(s=>'<th title="'+esc(nm(s))+'">'+N(s.n)+'</th>').join('')+'</tr></thead><tbody>';
  ST.forEach(r=>{h+='<tr><th class="rl">'+N(r.n)+' '+esc(nm(r))+'</th>'+ST.map(c=>{
    if(r.n===c.n)return '<td class="z"></td>';
    const fi=fareInfo(r.n,c.n),sel=(r.n===FC.a&&c.n===FC.b)||(r.n===FC.b&&c.n===FC.a);
    return '<td class="'+(sel?'k':fi.exact?'r':'u')+'">'+(fi.exact?N(fi.f):N(fi.lo)+'–'+N(fi.hi))+'</td>';}).join('')+'</tr>';});
  return '<div class="tw mx"><table>'+h+'</tbody></table></div>';
}

function bFares(){

    e.textContent='';FC.a=+a.value;FC.b=+b.value;out.innerHTML=fareResult();$('#mxo').innerHTML=matrix();};
  a.onchange=up;b.onchange=up;$('#cfs').onclick=()=>{const t=a.value;a.value=b.value;b.value=t;up();};
  $('#cf').onsubmit=ev=>{ev.preventDefault();up();};
  up();
}

function fldHTML(id,f){
  const L=esc(f.l[lang==='bn'?1:0]),r=f.req?' <span aria-hidden="true">*</span>':'',fid=id+'-'+f.k;let c='';
  if(f.t==='text')c='<input type="text" id="'+fid+'" name="'+f.k+'" autocomplete="off">';
  else if(f.t==='textarea')c='<textarea id="'+fid+'" name="'+f.k+'"></textarea>';
  else if(f.t==='date')c='<input type="date" id="'+fid+'" name="'+f.k+'" max="'+new Date().toISOString().slice(0,10)+'">';
  else if(f.t==='contact')c='<input type="text" id="'+fid+'" name="'+f.k+'" inputmode="email" autocomplete="off" placeholder="name@example.com / 01XXXXXXXXX">';
  else if(f.t==='station')c='<select id="'+fid+'" name="'+f.k+'">'+stOpts()+'</select>';
  else if(f.t==='select')c='<select id="'+fid+'" name="'+f.k+'"><option value="">'+T('Select','বাছাই করুন')+'</option>'+f.o.map(o=>'<option value="'+o[0]+'">'+(lang==='bn'?o[2]:o[1])+'</option>').join('')+'</select>';
  else if(f.t==='rate')return '<fieldset style="border:0;padding:0;margin:0" id="'+fid+'-w"><legend style="font-weight:600;font-size:.88rem;margin-bottom:5px">'+L+r+'</legend><div class="rate">'+[5,4,3,2,1].map(n=>'<label><input type="radio" name="'+f.k+'" value="'+n+'"> '+N(n)+' ★</label>').join('')+'</div><div class="fe" id="'+fid+'-e" role="alert"></div></fieldset>';
  return '<div><label for="'+fid+'">'+L+r+'</label>'+c+'<div class="fe" id="'+fid+'-e" role="alert"></div></div>';
}
function checkField(id,f){
  const el=$('#'+id+'-'+f.k),w=$('#'+id+'-'+f.k+'-w');let v,msg='';
  if(f.t==='rate'){const c=$('input[name="'+f.k+'"]:checked',$('#'+id));v=c?c.value:'';}else v=(el.value||'').trim();
  if(f.req&&!v)msg=T('This field is required.','এই ঘরটি পূরণ আবশ্যক।');
  else if(v&&f.min&&v.length<f.min)msg=T('Please write at least '+f.min+' characters.','কমপক্ষে '+N(f.min)+'টি অক্ষর লিখুন।');
  else if(v&&f.t==='contact'&&!(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)||/^\+?[0-9][0-9\s-]{8,14}$/.test(v)))msg=T('Enter a valid email address or phone number.','সঠিক ইমেইল বা ফোন নম্বর দিন।');
  else if(v&&f.t==='date'&&v>new Date().toISOString().slice(0,10))msg=T('The date cannot be in the future.','তারিখ ভবিষ্যতের হতে পারে না।');
  $('#'+id+'-'+f.k+'-e').textContent=msg;
  if(el){if(msg)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid');}
  return msg?(el||$('input[name="'+f.k+'"]',$('#'+id))):null;
}
function formView(key){

  return '<div class="card"><h3>'+T(F.title[0],F.title[1])+'</h3><p class="sm muted" style="margin:6px 0 14px">'+T('Reports are saved on this device only. This site cannot send them to DMTCL. To reach DMTCL, use its official channels or a station counter.','রিপোর্ট শুধু এই ডিভাইসে সংরক্ষিত হয়। এই সাইট থেকে ডিএমটিসিএল-এ পাঠানো যায় না। ডিএমটিসিএল-এর সঙ্গে যোগাযোগে তাদের সরকারি মাধ্যম বা স্টেশন কাউন্টার ব্যবহার করুন।')+'</p>'+
   '<form id="f-'+key+'" class="ff" novalidate>'+F.fields.map(f=>fldHTML('f-'+key,f)).join('')+'<div><button class="btn" type="submit">'+T('Save report','রিপোর্ট সংরক্ষণ')+'</button></div></form><div id="ok-'+key+'"></div></div>';
}
function bindForm(key){
  const id='f-'+key,F=FORMS[key];
  $('#'+id).onsubmit=ev=>{ev.preventDefault();
    let first=null;F.fields.forEach(f=>{const bad=checkField(id,f);if(bad&&!first)first=bad;});
    if(first){first.focus();return;}
    const ref='DM-'+Math.random().toString(36).slice(2,8).toUpperCase(),data={ref:ref,type:key,at:new Date().toISOString()};
    F.fields.forEach(f=>{const el=$('#'+id+'-'+f.k);data[f.k]=f.t==='rate'?(($('input[name="'+f.k+'"]:checked',$('#'+id))||{}).value||''):(el?el.value.trim():'');});
    try{const a=JSON.parse(localStorage.getItem('dm-reports')||'[]');a.push(data);localStorage.setItem('dm-reports',JSON.stringify(a));}catch(e){}
    $('#'+id).hidden=true;
    $('#ok-'+key).innerHTML='<div class="alert" style="margin-top:8px"><div class="ai">'+ic('check')+'</div><div><h3>'+T('Report saved on this device','রিপোর্ট এই ডিভাইসে সংরক্ষিত হয়েছে')+'</h3><p class="sm muted">'+T('Reference','রেফারেন্স')+': <b id="refv">'+ref+'</b>. '+T('It has not been sent to DMTCL. Keep the reference and contact DMTCL through its official channels.','এটি ডিএমটিসিএল-এ পাঠানো হয়নি। রেফারেন্স রেখে দিন এবং সরকারি মাধ্যমে ডিএমটিসিএল-এর সঙ্গে যোগাযোগ করুন।')+'</p><div class="chips" style="margin-top:10px"><button class="btn ghost sm" type="button" id="cpr">'+ic('copy')+T('Copy reference','রেফারেন্স কপি')+'</button><button class="btn ghost sm" type="button" id="again">'+T('Submit another','আরেকটি জমা দিন')+'</button></div></div></div>';
    $('#cpr').onclick=()=>copyText(ref,$('#refv'));
    $('#again').onclick=()=>{$('#'+id).reset();$('#'+id).hidden=false;$('#ok-'+key).innerHTML='';};
  };
  F.fields.forEach(f=>{const el=$('#'+id+'-'+f.k);if(el)el.onblur=()=>checkField(id,f);});
}

/* ---------- router ---------- */
function parseRoute(){const h=(location.hash||'#home').slice(1);if(h.indexOf('station-')===0)return ['station',h.slice(8)];return [VIEWS[h]?h:'home'];}
function render(){
  const pr=parseRoute(),name=pr[0],arg=pr[1],main=$('#main');
  let html,bind,title,desc;
  if(name==='station'){const s=ST.find(x=>x.slug===arg);html=vStation(arg);bind=()=>bStation(arg);title=s?nm(s)+' '+T('Station','স্টেশন'):T('Station not found','স্টেশন পাওয়া যায়নি');desc=s?'Dhaka Metro '+s.en+' station: neighbours, fares and nearby places.':DESC.home;}
  else{const v=VIEWS[name];html=v[0]();bind=v[1];title=T(v[2][0],v[2][1]);desc=DESC[name];}
  try{main.innerHTML=html;bind();}
  catch(err){main.innerHTML='<div class="wrap sec"><div class="empty"><b>'+T('Something went wrong','কিছু ভুল হয়েছে')+'</b>'+T('Reload the page or go back to the home page.','পাতাটি রিলোড করুন বা হোমে ফিরুন।')+'<br><a class="btn sm" style="margin-top:12px" href="#home">'+T('Home','হোম')+'</a></div></div>';if(window.console)console.error(err);}
  main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');
  document.title=(name==='home'?'':title+' · ')+'Dhaka Metro Smart Transit';
  let m=$('meta[name="description"]');if(m)m.setAttribute('content',desc);
  $$('.dnav a,.mnav a').forEach(a=>{if(a.getAttribute('href')==='#'+(name==='station'?'stations':name))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  $('#mnav').classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);

function openSearch(){const g=$('#gs');g.hidden=false;$('#gsi').value='';gsRes('');setTimeout(()=>$('#gsi').focus(),20);}

function gsRes(q){
  q=q.trim().toLowerCase();
  const sts=ST.filter(s=>!q||s.en.toLowerCase().includes(q)||s.bn.includes(q)||s.area[0].toLowerCase().includes(q)||String(s.n)===q).slice(0,q?16:6);

const ALIAS={1:['uttara north','uttara uttar','উত্তরা উত্তর'],2:['uttara center','uttara centre','উত্তরা সেন্টার'],3:['uttara south','uttara dakshin','উত্তরা দক্ষিণ'],4:['pallabi','পল্লবী'],5:['mirpur 11','mirpur-11','mirpur11','মিরপুর ১১','মিরপুর-১১'],6:['mirpur 10','mirpur-10','mirpur10','মিরপুর ১০','মিরপুর-১০'],7:['kazipara','কাজীপাড়া'],8:['shewrapara','sheorapara','শেওড়াপাড়া'],9:['agargaon','আগারগাঁও'],10:['bijoy sarani','bijoy sharani','বিজয় সরণি'],11:['farmgate','ফার্মগেট'],12:['karwan bazar','kawran bazar','karwanbazar','কারওয়ান বাজার'],13:['shahbagh','shahbag','শাহবাগ'],14:['dhaka university','dhaka uni','du ','ঢাকা বিশ্ববিদ্যালয়'],15:['secretariat','sachibalaya','সচিবালয়'],16:['motijheel','motijhil','মতিঝিল']};
function findStations(q){
  const s=' '+q.toLowerCase()+' ',hits=[];
  Object.keys(ALIAS).forEach(n=>{let best=-1;ALIAS[n].forEach(a=>{const i=s.indexOf(a.indexOf(' ')===a.length-1?' '+a:a);if(i>=0&&(best<0||i<best))best=i;});if(best>=0)hits.push([best,+n]);});
  hits.sort((a,b)=>a[0]-b[0]);return hits.map(h=>h[1]);
}

  if(/first|last|time|schedule|timing|friday|hour|when|সময়|ট্রেন|শুক্র/.test(s))return T('Saturday to Thursday: first train 6:30 am from Uttara North and 7:15 am from Motijheel; last trains 9:50 pm and 10:30 pm. Fridays start in the afternoon (about 3:00 pm and 3:20 pm). Published schedule, last updated 7 June 2026.','শনি–বৃহস্পতিবার: প্রথম ট্রেন উত্তরা উত্তর থেকে সকাল ৬:৩০ ও মতিঝিল থেকে সকাল ৭:১৫; শেষ ট্রেন রাত ৯:৫০ ও ১০:৩০। শুক্রবার বিকাল থেকে (প্রায় ৩:০০ ও ৩:২০)। প্রকাশিত সময়সূচি, সর্বশেষ হালনাগাদ ৭ জুন ২০২৬।')+goBtn('schedule',T('See schedule','সময়সূচি দেখুন'));
  if(/fare|price|cost|ticket|how much|ভাড়া|টিকিট|দাম/.test(s))return T('Fares run from Tk 20 to Tk 100 by distance (Tk 5 per km). Uttara North to Motijheel is Tk 100. Card users get 10% off. Name two stations, for example "Farmgate to Motijheel", and I will give the fare.','ভাড়া দূরত্ব অনুযায়ী ২০ থেকে ১০০ টাকা (প্রতি কিমি ৫ টাকা)। উত্তরা উত্তর থেকে মতিঝিল ১০০ টাকা। কার্ডে ১০% ছাড়। দুটি স্টেশনের নাম লিখুন, যেমন "ফার্মগেট থেকে মতিঝিল", আমি ভাড়া বলে দেব।')+goBtn('fares',T('Fare calculator','ভাড়া ক্যালকুলেটর'));
  if(/access|wheelchair|disab|lift|ramp|blind|হুইলচেয়ার|প্রতিবন্ধী/.test(s))return T('Reported features include lifts with braille, ramps, wheelchair space in each coach, a low ticket booth and tactile paths. Facilities can differ by station.','জানানো সুবিধার মধ্যে ব্রেইলসহ লিফট, র‍্যাম্প, প্রতি কোচে হুইলচেয়ার জায়গা, নিচু টিকিট বুথ ও স্পর্শনির্ভর পথ আছে। সুবিধা স্টেশনভেদে আলাদা হতে পারে।')+goBtn('guide',T('Accessibility guide','অ্যাক্সেসিবিলিটি নির্দেশিকা'));
  if(/lost|found|forgot|হারা/.test(s))return T('Use the Lost and Found form in the Help Center to keep a record, and tell station staff. This site cannot send the report to DMTCL.','রেকর্ড রাখতে সহায়তা কেন্দ্রের হারানো ও প্রাপ্তি ফর্ম ব্যবহার করুন এবং স্টেশন কর্মীদের জানান। এই সাইট থেকে রিপোর্ট ডিএমটিসিএল-এ পাঠানো যায় না।')+goBtn('help',T('Help Center','সহায়তা কেন্দ্র'));
  if(/emergency|police|danger|accident|999|জরুরি|পুলিশ/.test(s))return T('In an emergency call 999 and tell station staff or the MRT Police on duty.','জরুরি অবস্থায় ৯৯৯-এ কল করুন এবং স্টেশন কর্মী বা দায়িত্বরত এমআরটি পুলিশকে জানান।');
  if(/rule|prohibit|allowed|smok|pet|food|eat|drink|luggage|নিয়ম|নিষি/.test(s))return T('No smoking, eating or drinking on platforms and in stations. Pets, firearms, dangerous goods and bulky goods are not allowed. Men may not board the women\'s coach.','প্ল্যাটফর্ম ও স্টেশনে ধূমপান, খাওয়া ও পান নিষেধ। পোষা প্রাণী, আগ্নেয়াস্ত্র, বিপজ্জনক ও বড় মালামাল নিষিদ্ধ। পুরুষরা নারী কোচে উঠতে পারবেন না।')+goBtn('guide',T('Passenger rules','যাত্রীদের নিয়ম'));
  if(/station|stop|how many|line|স্টেশন/.test(s))return T('MRT Line 6 has 16 elevated stations from Uttara North to Motijheel, about 20.1 km. A 17th station at Kamalapur is under construction.','এমআরটি লাইন ৬-এ উত্তরা উত্তর থেকে মতিঝিল পর্যন্ত প্রায় ২০.১ কিমি পথে ১৬টি এলিভেটেড স্টেশন। কমলাপুরে ১৭তম স্টেশন নির্মাণাধীন।')+goBtn('stations',T('All stations','সব স্টেশন'));
  if(/^(hi|hello|hey|salam|assalam|হ্যালো|হাই|সালাম)/.test(s.trim()))return T('Hello. Ask me about a route, a fare, train times or passes.','হ্যালো। রুট, ভাড়া, ট্রেনের সময় বা পাস সম্পর্কে জিজ্ঞাসা করুন।');
  return T('I could not match that to the published data I have. Try a route like "Agargaon to Motijheel", or ask about fares, passes, train times or rules. For anything else, check dmtcl.gov.bd.','এটি আমার কাছে থাকা প্রকাশিত তথ্যের সঙ্গে মেলাতে পারিনি। "আগারগাঁও থেকে মতিঝিল"-এর মতো রুট লিখুন বা ভাড়া, পাস, ট্রেনের সময় বা নিয়ম জিজ্ঞাসা করুন। অন্য বিষয়ে dmtcl.gov.bd দেখুন।');
}
function chatReset(){
  $('#clog').innerHTML='';
  say(T('Hi, I am Metro Assistant. I answer from the published data on this site, not from live AI. I can help with routes, fares, stations, passes and rules.','হ্যালো, আমি মেট্রো অ্যাসিস্ট্যান্ট। আমি এই সাইটের প্রকাশিত তথ্য থেকে উত্তর দিই, লাইভ এআই থেকে নয়। রুট, ভাড়া, স্টেশন, পাস ও নিয়ম নিয়ে সাহায্য করতে পারি।'));
  const qs=[['Farmgate to Motijheel','ফার্মগেট থেকে মতিঝিল'],['What is MRT Pass?','এমআরটি পাস কী?'],['First and last train','প্রথম ও শেষ ট্রেন'],['Passenger rules','যাত্রীদের নিয়ম']];
  $('#cchips').innerHTML=qs.map(q=>'<button type="button">'+T(q[0],q[1])+'</button>').join('');
  $$('#cchips button').forEach((b,i)=>b.onclick=()=>ask(T(qs[i][0],qs[i][1])));
}
function ask(q){
  q=q.trim();if(!q)return;say(esc(q),'u');
  const d=say('<span class="muted">…</span>');
  setTimeout(()=>{d.innerHTML=answer(q);$$('[data-go]',d).forEach(b=>b.onclick=()=>{go(b.dataset.go);$('#chat').hidden=true;$('#fab').setAttribute('aria-expanded','false');});$('#clog').scrollTop=1e6;},250);
}

/* ---------- boot ---------- */
function boot(){
  try{const t=localStorage.getItem('dm-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
  document.documentElement.lang=lang;
  chrome();chatReset();render();
  $('#skip').onclick=()=>{const m=$('#main');m.focus();m.scrollIntoView();};
  $('#fab').onclick=()=>{const c=$('#chat'),o=c.hidden;c.hidden=!o;$('#fab').setAttribute('aria-expanded',o);if(o)setTimeout(()=>$('#cin').focus(),30);};
  $('#chx').onclick=()=>{$('#chat').hidden=true;$('#fab').setAttribute('aria-expanded','false');$('#fab').focus();};
  $('#cform').onsubmit=e=>{e.preventDefault();const v=$('#cin').value;$('#cin').value='';ask(v);};
  $('#gsi').oninput=e=>gsRes(e.target.value);
  $('#gsi').onkeydown=e=>{if(e.key==='Enter'){const a=$('#gsr a');if(a){e.preventDefault();a.click();location.hash=a.getAttribute('href');}}};
  $('#gs').onclick=e=>{if(e.target.id==='gs')closeSearch();};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('#gs').hidden)closeSearch();else if(!$('#chat').hidden){$('#chat').hidden=true;$('#fab').setAttribute('aria-expanded','false');}else if($('#pop')){const x=$('#popx');if(x)x.click();}}
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();openSearch();}
  });
}
boot();
</script>
